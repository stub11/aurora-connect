name: Router preflight CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify router preflight under BusyBox
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
          busybox sh -n router/preflight.sh
          busybox sh router/tests/preflight-report.sh
