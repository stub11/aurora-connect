name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Decode public dev key
        run: |
          mkdir -p build
          base64 -d android/dev-keystore.jks.b64 > build/aurora-dev.jks
      - run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify APK certificate
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in app/build/outputs/apk/{debug,release}/*.apk; do
            "$signer" verify --print-certs "$apk" > cert.txt
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' cert.txt)
            test "$actual" = "$(cat android/dev-cert.sha256)"
            printf 'Certificate SHA256: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Prepare dev release assets
        run: |
          set -euo pipefail
          mkdir -p build/dev-release
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > build/dev-release-badging.txt
          python - "$apk" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          import shutil
          import sys
          from pathlib import Path

          package = Path("build/dev-release-badging.txt").read_text().splitlines()[0]
          match = re.match(r"package: name='[^']+' versionCode='([0-9]+)' versionName='([^']+)'", package)
          expected_code = int(os.environ["GITHUB_RUN_NUMBER"])
          expected_name = "0.1.0-" + os.environ["GITHUB_SHA"][:8]
          if match is None or (int(match[1]), match[2]) != (expected_code, expected_name):
              raise SystemExit("APK version does not match this CI run")

          assets = Path("build/dev-release")
          apk = assets / f"aurora-connect-{match[2]}.apk"
          shutil.copyfile(sys.argv[1], apk)
          with apk.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          (assets / "SHA256").write_text(f"{digest}  {apk.name}\n")
          manifest = {
              "versionCode": int(match[1]),
              "versionName": match[2],
              "file": apk.name,
              "sha256": digest,
              "size": apk.stat().st_size,
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "notes": "Тестовая сборка Aurora Connect",
          }
          (assets / "update.json").write_text(
              json.dumps(manifest, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: aurora-dev-release
          path: build/dev-release/
          if-no-files-found: error
      - name: Scan secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: aurora-dev-release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="0.1.0-${GITHUB_SHA:0:8}"
          APK="aurora-connect-$VERSION_NAME.apk"
          sha256sum --check SHA256
          gh release create "dev-$GITHUB_RUN_NUMBER" "$APK" SHA256 update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Dev $VERSION_NAME" --notes "Тестовая сборка. Не импортируйте реальный конфиг."
