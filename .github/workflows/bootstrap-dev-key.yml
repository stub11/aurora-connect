name: Bootstrap public dev key
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-dev-key.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-dev-key
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate once
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/dev-keystore.jks.b64 ]]; then
            test -s android/dev-cert.sha256
            exit 0
          fi
          mkdir -p android
          key="$RUNNER_TEMP/aurora-dev.jks"
          keytool -genkeypair -storetype JKS -keystore "$key" -keyalg RSA -keysize 3072 -validity 10958 -alias aurora-dev -storepass aurora-dev-public -keypass aurora-dev-public -dname 'CN=Aurora Dev, O=Aurora Connect (dev, public key)'
          base64 -w0 "$key" > android/dev-keystore.jks.b64
          keytool -exportcert -alias aurora-dev -keystore "$key" -storepass aurora-dev-public | sha256sum | cut -d' ' -f1 > android/dev-cert.sha256
          git config user.name aurora-bot
          git config user.email 'aurora-bot@users.noreply.github.com'
          git add android/dev-keystore.jks.b64 android/dev-cert.sha256
          git commit -m 'Bootstrap public test-only signing key'
          git push origin HEAD:main
          printf 'Dev certificate SHA256: %s\n' "$(cat android/dev-cert.sha256)" >> "$GITHUB_STEP_SUMMARY"
